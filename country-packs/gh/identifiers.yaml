  - code: BANK_ACCOUNT_NUMBER
    name: Ghanaian bank account number
    issuer: Individual banks; clearing via GhIPSS under Bank of Ghana
    format:
      description: >-
        There is no national account number standard or IBAN. Account numbers are digits only, 8 to 16 digits,
        most often 13, with no published national checksum. Interbank payments pair the account number with a
        6-digit sort code (see GH_BANK_SORT_CODE).
      examples_synthetic: ["1234567890123"]
    validation_state: UNVERIFIED
    evidence_level: unpublished
    detection: context-required digit run (account/acct/a/c number, bank names, sort code nearby); no checksum
    context_words_en: ["account number", "acct", "a/c", "bank", "sort code", "branch", "transfer to", "GCB", "Ecobank", "Stanbic", "Fidelity", "CalBank", "Absa", "Zenith", "ADB", "Republic Bank", "Access Bank", "UBA", "GTBank", "Prudential", "Consolidated Bank"]
    false_positive_risks: ["Any 13-digit number; require context."]
    evidence:
      - url: https://www.bog.gov.gh/wp-content/uploads/2019/08/Bank-Branch-Sort-Codes-August-2017.pdf
        publisher: Bank of Ghana
        strength: authoritative
        says: "Sort codes are 6 digits identifying the bank, the clearing zone and the branch; account number formats are not specified."
      - url: https://docs.coverbase.com/user-guides/supplier-countries/gh.md
        publisher: Coverbase (payments documentation)
        strength: reputable_secondary
        says: "Account number 8 to 16 digits; bank code 2 digits; branch code 4 digits."
    open_question: "Per-bank account number lengths could tighten detection; collect from bank documentation, never from real accounts."

  - code: GH_BANK_SORT_CODE
    name: Ghanaian bank branch sort code
    issuer: Bank of Ghana; Ghana Interbank Payment and Settlement Systems (GhIPSS)
    format:
      description: >-
        Six digits in three pairs: bank code, clearing zone, branch (Bank of Ghana's example 01-02-03). The
        bank code alone is written as the first two digits followed by 0100 in the Bank of Ghana list. A sort
        code identifies a branch, not a person; it matters because it travels with account numbers and makes
        an adjacent digit run far more likely to be an account.
      pattern_hint: '\b(?:0[1-9]|[1-3]\d)[ -]?\d{2}[ -]?\d{2}\b'
      examples_synthetic: ["13-01-01", "040101"]
      bank_codes_2017: {"01": "Bank of Ghana", "02": "Standard Chartered Bank", "03": "Barclays Bank", "04": "GCB BANK LTD", "05": "National Investment Bank", "06": "United Bank for Africa", "07": "ARB Apex & Rural Banks", "08": "Agric. Development Bank", "09": "Societe Generale Ghana Ltd", "10": "Universal Merchant Bank (GH) Ltd", "11": "HFC Bank (GH) Ltd", "12": "Zenith Bank (GH) Ltd", "13": "Ecobank (GH) Ltd", "14": "Cal Bank Ltd", "17": "First Atlantic Bank", "18": "Prudential Bank Ltd.", "19": "Stanbic Bank Ghana Ltd", "20": "FBN Bank Ghana", "21": "Bank of Africa -Ghana Ltd", "22": "Unibank Ghana Ltd", "23": "Guaranty Trust (Gh) Ltd.", "24": "Fidelity Bank Ghana Ltd", "26": "Bank Of Baroda (Gh) Ltd.", "27": "BSIC Ghana Ltd.", "28": "Access Bank CHG", "29": "Energy Bank CHG", "30": "The Royal Bank CHG", "32": "GN Bank Ltd", "33": "First National Bank", "34": "Sovereign Bank LTD"}
    validation_state: VALID_FORMAT
    evidence_level: issuer_confirmed
    validation_note: "Validate the bank code against the published list; zone and branch need the full branch table."
    detection: context only (sort code, branch, bank names); used mainly as a context signal for BANK_ACCOUNT_NUMBER
    context_words_en: ["sort code", "branch code", "bank code", "GhIPSS"]
    sensitivity_note: "Organisational identifier, not personal data on its own."
    evidence:
      - url: https://www.bog.gov.gh/wp-content/uploads/2019/08/Bank-Branch-Sort-Codes-August-2017.pdf
        publisher: Bank of Ghana
        date: "2017-08"
        strength: authoritative
        says: "A 6-digit unique sort code is assigned to each bank branch: first two digits the bank's code, next two the clearing zone, last two the branch."
      - url: https://ghipss.net/bank-sort-codes/
        publisher: GhIPSS
        strength: authoritative
        says: "Current clearing house sort codes per bank."
    open_question: "The 2017 list predates bank mergers and closures (for example Barclays became Absa, HFC became Republic); refresh from GhIPSS."
    checked: "2026-11-04"

  - code: GH_MOMO_MERCHANT_ID
    name: Mobile money merchant (MoMoPay) code
    issuer: Mobile money operators (MTN MoMo, Telecel Cash, AT Money)
    format:
      description: >-
        A short numeric code a business is paid through, entered after the operator's USSD menu (*170# for MTN
        MoMo, *110# for Telecel Cash and AT Money). Reported as 5 to 7 digits, with MTN describing six. It
        identifies a business, and for sole traders can identify a person.
      length: "5 to 7 digits (reported)"
      examples_synthetic: ["123456"]
    validation_state: UNVERIFIED
    evidence_level: secondary
    detection: context only (merchant ID, MoMo Pay, pay to merchant, USSD codes nearby)
    context_words_en: ["merchant ID", "merchant code", "MoMo Pay", "MoMoPay", "pay merchant", "*170#", "*110#", "till number"]
    evidence:
      - url: https://www.maxmegroup.com/learn/momo-merchant-account-ghana
        publisher: Maxme Group (citing an MTN statement, 2023)
        strength: reputable_secondary
        says: "A customer pays an MTN merchant by dialling *170# and choosing MoMo Pay & Pay Bill; the merchant ID is a six-digit code."
      - url: https://momocalc.com/ghana/momo-merchant-code
