[package]
name = "veil-wasm"
description = "WebAssembly bindings for Dekka Veil, with the model's graph run by onnxruntime-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
veil.workspace = true
veil-inference.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"

# The tokenizer's WebAssembly support, only when building for it, so native builds of the
# workspace keep their usual features.
[target.'cfg(target_arch = "wasm32")'.dependencies]
veil-inference = { workspace = true, features = ["wasm"] }
