name: release-python

# Builds dekka-veil wheels for every supported platform and an sdist. A run started by hand
# only builds, unless `publish` is ticked; pushing a version tag such as v0.1.0 publishes.
# Publishing uses PyPI's trusted publishing, so no token is stored: add this repository and
# workflow as a trusted publisher for dekka-veil on PyPI, in an environment called pypi.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI after building
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: macos-15, target: aarch64 }
          - { os: macos-15, target: x86_64 }
          - { os: windows-2025, target: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # ort's build script downloads ONNX Runtime over native TLS, which needs OpenSSL's
          # headers in the manylinux container. Only the build script uses it, so the wheel
          # doesn't link OpenSSL.
          before-script-linux: dnf install -y openssl-devel
          args: --release --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist
          retention-days: 7

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: bindings/python/dist
          retention-days: 7

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
